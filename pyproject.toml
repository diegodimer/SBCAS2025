[tool.poetry]
name = "fairnessinsight"
version = "0.1.1"
description = ""
authors = ["Diego Dimer"]
readme = "README.md"
packages = [{ include = "fairnessinsight" }]

exclude = ["fairnessinsight/experiment_utils",
            "fairnessinsight/PreTrainingBias/test_PreTrainingBias.py",
            "fairnessinsight/GliomaDataset-Experiment.py", 
            "fairnessinsight/DiabetesDataset-Experiment.py", 
            "fairnessinsight/HeartDataset-Experiment.py", "fairnessinsight/IntersectionalBiasDataset-Experiment.py", "fairnessinsight/requirements.txt"]

[tool.poetry.dependencies]
graphviz = "0.20.1"
matplotlib = "3.6.0"
numpy = "1.23.2"
pandas = "1.4.4"
pyfunctional = "1.4.3"
scikit_learn = "1.2.1"
ydata-profiling = "4.12.1"
numba = "0.58.1"

[tool.poetry.group.test.dependencies]
pytest = "8.3.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
