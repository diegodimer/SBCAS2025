[tool.poetry]
name = "sbcasdiego"
version = "0.1.0"
description = ""
authors = ["Diego Dimer"]
readme = "README.md"
packages = [{ include = "sbcasdiego" }]

exclude = ["code/experiment_utils", 
            "code/GliomaDataset-Experiment.py", 
            "code/DiabetesDataset-Experiment.py", 
            "code/HeartDataset-Experiment.py", "code/IntersectionalBiasDataset-Experiment.py", "code/requirements.txt"]

[tool.poetry.dependencies]
graphviz = "0.20.1"
matplotlib = "3.6.0"
numpy = "1.23.2"
pandas = "1.4.4"
pyfunctional = "1.4.3"
scikit_learn = "1.2.1"
ydata-profiling = "4.12.1"
numba = "0.58.1"

[tool.poetry.group.test.dependencies]
pytest = "8.3.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
